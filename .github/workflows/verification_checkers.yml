name: Verification checkers

# Static class checkers from test/verification/: each run reports
# checked/violated/unknown and gates against test/verification/baseline.json
# (fails on violations not in the baseline, and on baseline entries that no
# longer fire). Self-tests run first so a broken checker cannot pass silently.
# stdlib-Python only; no submodules required.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'

jobs:
  verification_checkers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checker self-tests
        run: |
          python3 test/verification/checkers/check_registry_ic_defaults.py --self-test
          python3 test/verification/checkers/check_bcast_types.py --self-test
          python3 test/verification/checkers/check_readnl_bcast.py --self-test
      - name: Registry IC default neutrality (P2)
        run: python3 test/verification/checkers/check_registry_ic_defaults.py
      - name: MPI broadcast / namelist XML type agreement (P6)
        run: python3 test/verification/checkers/check_bcast_types.py
      - name: Namelist read / broadcast completeness and counts (P6 companion)
        run: python3 test/verification/checkers/check_readnl_bcast.py

  # Property suites execute real generator code paths (cam_autogen,
  # BuildCacheCAM, gen_registry), so they need the ccpp_framework and cime
  # externals. Known-open defects are expectedFailure ratchets: when the fix
  # lands the unexpected success fails CI until the marker is removed.
  verification_properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install xmllint (registry schema validation)
        run: |
          sudo apt-get update
          sudo apt-get install libxml2-utils
      - name: Checkout externals used by the generator code paths
        run: |
          bin/git-fleximod update ccpp-framework
          bin/git-fleximod update cime
      - name: Install hypothesis
        run: python3 -m pip install hypothesis
      - name: Build-cache property suite
        run: python3 test/verification/properties/test_build_cache.py
      - name: Registry-generator property suite
        run: python3 test/verification/properties/test_registry_gen.py
      - name: Init-mark property suite
        run: python3 test/verification/properties/test_init_marks.py

  # TLA+ protocol models: TLC exhaustively checks each scenario and the
  # driver asserts every declared verdict (pre-fix scenarios must violate
  # exactly their named invariant, fixed/legal scenarios must pass, fault
  # injections must fail their liveness companion). The TLC jar is pinned
  # by version and sha256 so verdict signals stay stable.
  verification_models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned TLC (tla2tools.jar, tlaplus release v1.7.4)
        run: |
          curl -sSL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum -c -
      - name: M2 history-lifecycle model scenarios
        run: TLA2TOOLS_JAR=/tmp/tla2tools.jar python3 test/verification/models/m2_history/run_m2.py
      - name: M4 tracer_data bracketing oracle scenarios
        run: python3 test/verification/models/m4_tracer_data/run_m4_oracle.py

  # Differential harnesses: real CAM-SIMA code compiled against recording
  # stubs, driven through the model scenarios and compared with the
  # executable reference models. Counterexamples replay as expectedFailure
  # ratchets until their fix groups land; an unexpected success fails the
  # job. M2 = hist_file_t vs the M2 TLA+ spec's fixed protocol (needs the
  # buffers submodule); M4 = tracer_data vs the bracketing oracle (needs
  # gfortran only).
  verification_harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Checkout the history buffers submodule
        run: bin/git-fleximod update history
      - name: M2 differential harness
        run: python3 test/verification/harnesses/m2_history/run_m2_harness.py
      - name: M4 differential harness
        run: python3 test/verification/harnesses/m4_tracer_data/run_m4_harness.py

  # capgen v0-vs-v1 assumption ledger: one stub-host fixture generated,
  # compiled and driven through its phases by both the pinned framework
  # capgen (v0) and the capgen-v1 branch at the pin recorded in
  # run_ledger.py, which also records the staged interface divergences.
  # A behavioural difference fails as a named assumption (A1..A7).
  verification_ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install gfortran and xmllint (capgen validates suite XML)
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libxml2-utils
      - name: Checkout the ccpp_framework submodule (capgen v0 pin)
        run: bin/git-fleximod update ccpp-framework
      - name: Fetch capgen-v1 at the recorded pin
        run: |
          V1_PIN=$(python3 -c "import re;print(re.search(r'V1_PIN = \"([0-9a-f]+)\"',open('test/verification/ledger/run_ledger.py').read()).group(1))")
          git clone --filter=blob:none https://github.com/NCAR/ccpp-framework /tmp/capgen-v1
          git -C /tmp/capgen-v1 checkout "$V1_PIN"
      - name: Assumption ledger (both generators)
        run: CAPGEN_V1_ROOT=/tmp/capgen-v1 python3 test/verification/ledger/run_ledger.py --require-v1
