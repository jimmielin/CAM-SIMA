\* Legal case on the PRE-FIX protocol: the shape of every shipped 1*nsteps
\* testmod (unconditionally sampled inst-only fields, healthy filename
\* spec).  All invariants hold, which is why CI never caught F-HIST-1/5.
SPECIFICATION Spec
CONSTANTS
  InstFields = {fI1}
  AvgFields = {}
  XYFillFields = {}
  AlwaysSampled = {fI1}
  OneStepOutput = TRUE
  WritePeriod = 1
  MaxFrames = 2
  MaxSteps = 4
  CoarseFilenames = FALSE
  CoarseDiv = 4
  FixRecomputeSplit = FALSE
  FixFillUnsampled = FALSE
  FixFilenameRegistry = FALSE
  MutAlwaysFill = FALSE
  MutNeverWrites = FALSE
INVARIANTS TypeOK SplitFlagsConsistent RoutingComplete NoDroppedData NoUndefinedData SampledDataIsWritten NoFilenameClobber
PROPERTY AllScheduledWritesOccur
