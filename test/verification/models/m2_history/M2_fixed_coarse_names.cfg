\* FG-3 protocol on the F-HIST-2 shape: the run-wide name registry halts
\* loudly on the first reuse instead of clobbering (no liveness checked;
\* the run is expected to abort).
SPECIFICATION Spec
CONSTANTS
  InstFields = {fI1}
  AvgFields = {}
  XYFillFields = {}
  AlwaysSampled = {fI1}
  OneStepOutput = TRUE
  WritePeriod = 1
  MaxFrames = 1
  MaxSteps = 4
  CoarseFilenames = TRUE
  CoarseDiv = 4
  FixRecomputeSplit = TRUE
  FixFillUnsampled = TRUE
  FixFilenameRegistry = TRUE
  MutAlwaysFill = FALSE
  MutNeverWrites = FALSE
INVARIANTS TypeOK SplitFlagsConsistent RoutingComplete NoDroppedData NoUndefinedData SampledDataIsWritten NoFilenameClobber
