\* FG-3 protocol, hardest shape: mixed inst+avg volume at 1*nsteps with
\* fully conditional sampling.  All safety invariants plus liveness.
SPECIFICATION Spec
CONSTANTS
  InstFields = {fI1}
  AvgFields = {fA1}
  XYFillFields = {}
  AlwaysSampled = {}
  OneStepOutput = TRUE
  WritePeriod = 1
  MaxFrames = 2
  MaxSteps = 4
  CoarseFilenames = FALSE
  CoarseDiv = 4
  FixRecomputeSplit = TRUE
  FixFillUnsampled = TRUE
  FixFilenameRegistry = TRUE
  MutAlwaysFill = FALSE
  MutNeverWrites = FALSE
INVARIANTS TypeOK SplitFlagsConsistent RoutingComplete NoDroppedData NoUndefinedData SampledDataIsWritten NoFilenameClobber
PROPERTY AllScheduledWritesOccur
