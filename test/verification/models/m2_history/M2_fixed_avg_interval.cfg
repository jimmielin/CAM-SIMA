\* FG-3 protocol on the F-HIST-5 shape: conditional avg field, multi-step
\* interval; zero-sample intervals must write _FillValue.
SPECIFICATION Spec
CONSTANTS
  InstFields = {}
  AvgFields = {fA1}
  XYFillFields = {}
  AlwaysSampled = {}
  OneStepOutput = FALSE
  WritePeriod = 2
  MaxFrames = 2
  MaxSteps = 6
  CoarseFilenames = FALSE
  CoarseDiv = 4
  FixRecomputeSplit = TRUE
  FixFillUnsampled = TRUE
  FixFilenameRegistry = TRUE
  MutAlwaysFill = FALSE
  MutNeverWrites = FALSE
INVARIANTS TypeOK SplitFlagsConsistent RoutingComplete NoDroppedData NoUndefinedData SampledDataIsWritten NoFilenameClobber
PROPERTY AllScheduledWritesOccur
