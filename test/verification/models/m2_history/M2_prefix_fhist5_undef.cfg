\* F-HIST-5 historical counterexample: an avg field from a conditional
\* scheme with flag_xyfill=.false.; an interval with zero samples is
\* written from an uninitialized buffer (norm_val never assigned).
SPECIFICATION Spec
CONSTANTS
  InstFields = {}
  AvgFields = {fA1}
  XYFillFields = {}
  AlwaysSampled = {}
  OneStepOutput = FALSE
  WritePeriod = 2
  MaxFrames = 2
  MaxSteps = 4
  CoarseFilenames = FALSE
  CoarseDiv = 4
  FixRecomputeSplit = FALSE
  FixFillUnsampled = FALSE
  FixFilenameRegistry = FALSE
  MutAlwaysFill = FALSE
  MutNeverWrites = FALSE
INVARIANT NoUndefinedData
