\* F-HIST-1 historical counterexample: avg-only volume at 1*nsteps; the
\* override commits 'lst' but has_instantaneous stays FALSE, so the only
\* created file is the accumulated one and sampled data is silently dropped.
SPECIFICATION Spec
CONSTANTS
  InstFields = {}
  AvgFields = {fA1}
  XYFillFields = {}
  AlwaysSampled = {fA1}
  OneStepOutput = TRUE
  WritePeriod = 1
  MaxFrames = 2
  MaxSteps = 4
  CoarseFilenames = FALSE
  CoarseDiv = 4
  FixRecomputeSplit = FALSE
  FixFillUnsampled = FALSE
  FixFilenameRegistry = FALSE
  MutAlwaysFill = FALSE
  MutNeverWrites = FALSE
INVARIANT NoDroppedData
