\* F-HIST-2 historical counterexample: a filename spec that cannot
\* distinguish nearby opens (no %s) with mfilt=1; the duplicate check
\* skips the volume itself and PIO_CLOBBER truncates the earlier file.
SPECIFICATION Spec
CONSTANTS
  InstFields = {fI1}
  AvgFields = {}
  XYFillFields = {}
  AlwaysSampled = {fI1}
  OneStepOutput = TRUE
  WritePeriod = 1
  MaxFrames = 1
  MaxSteps = 4
  CoarseFilenames = TRUE
  CoarseDiv = 4
  FixRecomputeSplit = FALSE
  FixFillUnsampled = FALSE
  FixFilenameRegistry = FALSE
  MutAlwaysFill = FALSE
  MutNeverWrites = FALSE
INVARIANT NoFilenameClobber
