\* F-HIST-1, mixed-volume symptom: inst+avg at 1*nsteps; after the override
\* every field routes to the instantaneous file, yet has_accumulated stays
\* TRUE, so an empty accumulated file is created per rollover.
SPECIFICATION Spec
CONSTANTS
  InstFields = {fI1}
  AvgFields = {fA1}
  XYFillFields = {}
  AlwaysSampled = {fI1, fA1}
  OneStepOutput = TRUE
  WritePeriod = 1
  MaxFrames = 2
  MaxSteps = 4
  CoarseFilenames = FALSE
  CoarseDiv = 4
  FixRecomputeSplit = FALSE
  FixFillUnsampled = FALSE
  FixFilenameRegistry = FALSE
  MutAlwaysFill = FALSE
  MutNeverWrites = FALSE
INVARIANT SplitFlagsConsistent
