[package]
name = "rust_demo"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_demo"
path = "rust_demo.rs"
crate-type = ["staticlib", "rlib"]

# Path is resolved relative to this manifest. The scheme lives at
# `<cam-sima>/src/physics/rust_physics/schemes/rust_demo/Cargo.toml`,
# so `../../ccpp_rs` resolves to the support crate. This is the D-P1-2
# fallback location: the originally-preferred location in
# atmospheric_physics did not work because cargo refuses workspace
# members outside the workspace root -- see CP-F preflight notes in
# PROGRESS.md.
[dependencies]
ccpp_rs = { path = "../../ccpp_rs" }
